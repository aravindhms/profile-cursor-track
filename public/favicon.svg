<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ee3832" />
      <stop offset="45%" stop-color="#d21d18" />
      <stop offset="100%" stop-color="#7d0b07" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>

    <!-- Letter Gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eae6e5" />
    </linearGradient>

    <!-- SRE Pulse Glow -->
    <radialGradient id="statusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="1" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Monogram A -->
  <path d="M 216 112 L 296 112 L 406 392 L 340 392 L 312 316 L 200 316 L 172 392 L 106 392 Z M 222 256 L 290 256 L 256 162 Z" fill="url(#letterGrad)" />

  <!-- High-Availability SRE Status Pulse Beacon -->
  <circle cx="390" cy="122" r="32" fill="url(#statusGlow)" opacity="0.6" />
  <circle cx="390" cy="122" r="20" fill="#10b981" filter="url(#softGlow)" />
  <circle cx="390" cy="122" r="10" fill="#6ee7b7" />
  <circle cx="390" cy="122" r="4" fill="#ffffff" />
</svg>
